# Alertas de demo-api. Las métricas las publica la app en /metrics
# (prometheus-fastapi-instrumentator) y Prometheus las recoge con su ServiceMonitor.
# Los errores y la latencia los vigilan las alertas del SLO (demo-api-slo.yaml).
# Estas cubren lo que el SLO no ve: si no queda ninguna réplica, no hay métricas que medir.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-api
  namespace: monitoring
spec:
  groups:
    - name: demo-api
      rules:
        - alert: DemoApiDown
          expr: absent(up{namespace="demo-api"} == 1)
          for: 2m
          labels: {severity: critical}
          annotations:
            runbook_url: https://github.com/EA-etn/homelab-k3s/blob/main/docs/runbooks/DemoApiDown.md
            summary: demo-api no responde
            description: Ninguna réplica de demo-api responde a Prometheus desde hace 2 minutos.
        - alert: DemoApiSingleNode
          expr: count(count by (node) (kube_pod_info{namespace="demo-api", created_by_kind="ReplicaSet"})) < 2
          for: 15m
          labels: {severity: info}
          annotations:
            runbook_url: https://github.com/EA-etn/homelab-k3s/blob/main/docs/runbooks/DemoApiSingleNode.md
            summary: Todas las réplicas de demo-api están en un solo nodo
            description: Si ese nodo cae, demo-api se queda sin servicio hasta que se reprogramen los pods.
