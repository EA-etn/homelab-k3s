# Observabilidad: Prometheus, Grafana y Alertmanager (kube-prometheus-stack).
# Lo pesado corre en el portátil (homelab/role=worker) para no cargar la Raspberry Pi.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.17.1
    helm:
      releaseName: monitoring
      valuesObject:
        # k3s integra estos componentes en un solo proceso y no los expone: sin esto
        # habría objetivos caídos y alertas falsas.
        kubeEtcd: {enabled: false}
        kubeControllerManager: {enabled: false}
        kubeScheduler: {enabled: false}
        kubeProxy: {enabled: false}
        defaultRules:
          rules:
            etcd: false
            kubeControllerManager: false
            kubeProxy: false
            kubeSchedulerAlerting: false
            kubeSchedulerRecording: false
            windows: false

        prometheusOperator:
          nodeSelector: {homelab/role: worker}

        prometheus:
          prometheusSpec:
            nodeSelector: {homelab/role: worker}
            # Recoger los ServiceMonitor/PodMonitor/reglas de cualquier app, no solo de este chart
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            # 30 días: la ventana de los SLOs. retentionSize evita llenar el disco
            retention: 30d
            retentionSize: 8GB
            resources:
              requests: {cpu: 200m, memory: 512Mi}
              limits: {memory: 1536Mi}
            storageSpec:
              volumeClaimTemplate:
                spec:
                  storageClassName: local-path
                  accessModes: [ReadWriteOnce]
                  resources:
                    requests: {storage: 10Gi}

        alertmanager:
          alertmanagerSpec:
            nodeSelector: {homelab/role: worker}
            resources:
              requests: {cpu: 10m, memory: 32Mi}
            # Token del bot y chat de Telegram: NO están en Git. Secret creado a mano
            # (docs/alerting.md), montado en /etc/alertmanager/secrets/alertmanager-telegram/
            secrets: [alertmanager-telegram]
          # Notificaciones a Telegram. Validado en el CI con amtool (tests/alertmanager/)
          config:
            global:
              resolve_timeout: 5m
            route:
              receiver: telegram
              group_by: [namespace, alertname]
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 4h
              routes:
                # Watchdog siempre está activa (prueba de que las alertas funcionan): no avisar
                - {receiver: "null", matchers: ['alertname = "Watchdog"']}
                - {receiver: "null", matchers: ['alertname = "InfoInhibitor"']}
                # Las de severidad info son informativas: se ven en Grafana, sin mensaje
                - {receiver: "null", matchers: ['severity = "info"']}
            # Si salta una crítica, no avisar también de la warning o info del mismo problema
            inhibit_rules:
              - source_matchers: ['severity = "critical"']
                target_matchers: ['severity =~ "warning|info"']
                equal: [namespace, alertname]
              - source_matchers: ['severity = "warning"']
                target_matchers: ['severity = "info"']
                equal: [namespace, alertname]
              # Quema rápida y lenta del mismo SLO: basta con la rápida
              - source_matchers: ['alertname = "DemoApiErrorBudgetBurnFast"']
                target_matchers: ['alertname = "DemoApiErrorBudgetBurnSlow"']
                equal: [slo]
              - source_matchers: ['alertname = "InfoInhibitor"']
                target_matchers: ['severity = "info"']
                equal: [namespace]
              - target_matchers: ['alertname = "InfoInhibitor"']
            receivers:
              - name: "null"
              - name: telegram
                telegram_configs:
                  - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
                    chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/chat-id
                    parse_mode: HTML
                    message: '{{ template "telegram.homelab" . }}'
                    send_resolved: true
            templates:
              - /etc/alertmanager/config/*.tmpl
          templateFiles:
            telegram.tmpl: |-
              {{ define "telegram.homelab" -}}
              {{ range .Alerts -}}
              {{ $a := . -}}
              {{ if eq .Status "resolved" }}✅ <b>RESUELTA</b>{{ else if eq .Labels.severity "critical" }}🔴 <b>CRÍTICA</b>{{ else }}🟠 <b>AVISO</b>{{ end }} · <code>{{ .Labels.alertname }}</code>{{ with .Labels.slo }} · SLO {{ . }}{{ end }}
              {{ with .Annotations.summary }}<b>{{ . | html }}</b>
              {{ end -}}
              {{ with .Annotations.description }}{{ . | html }}
              {{ end -}}
              {{ with .Labels.namespace }}📦 {{ . }}{{ with $a.Labels.pod }} · {{ . }}{{ end }}
              {{ end -}}
              {{ with .Annotations.runbook_url }}📖 <a href="{{ . }}">Runbook: qué hacer</a>
              {{ end }}
              {{ end -}}
              {{ end }}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Los CRDs de Prometheus son demasiado grandes para el apply clásico
      - ServerSideApply=true
    retry:
      limit: 10
      backoff: {duration: 15s, factor: 2, maxDuration: 5m}
