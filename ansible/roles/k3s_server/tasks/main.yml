# Instala el servidor k3s (control plane) en la Raspberry Pi.
# Si ya está instalada la versión de group_vars, no hace nada: se puede ejecutar siempre.

- name: Ver qué versión de k3s está instalada
  ansible.builtin.command: k3s --version
  register: k3s_server_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Instalar o actualizar el servidor k3s
  when: k3s_version not in (k3s_server_installed.stdout | default(''))
  block:
    - name: Descargar el instalador oficial de k3s
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /usr/local/src/k3s-install.sh
        mode: "0755"

    - name: Ejecutar el instalador (servidor)
      ansible.builtin.command: /usr/local/src/k3s-install.sh server
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
        # Token fijo (del vault): así el agente puede unirse sin leerlo de la Pi
        K3S_TOKEN: "{{ vault_k3s_token }}"
      changed_when: true
      no_log: true

- name: Esperar a que el nodo esté Ready
  ansible.builtin.command: k3s kubectl wait --for=condition=Ready node/{{ inventory_hostname }} --timeout=300s
  changed_when: false
