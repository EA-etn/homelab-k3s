- name: Aplicar el reenvío de paquetes
  ansible.builtin.command: sysctl --system
  changed_when: true

- name: Reiniciar WireGuard
  ansible.builtin.systemd_service:
    name: "wg-quick@{{ wireguard_interface }}"
    state: restarted
  # En una simulación sobre una máquina sin WireGuard, el servicio aún no existe
  when: not (ansible_check_mode and wireguard_apt is changed)
