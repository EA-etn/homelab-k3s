# Instala ArgoCD (si no está) y le entrega el clúster: aplica la Application raíz, que crea
# todo lo que hay en apps/. A partir de aquí, el resto lo despliega ArgoCD desde Git.

- name: Ver si ArgoCD ya está instalado
  ansible.builtin.command: k3s kubectl -n argocd get deployment argocd-server
  register: argocd_installed
  changed_when: false
  failed_when: false
  check_mode: false

- name: Instalar ArgoCD {{ argocd_version }}
  when: argocd_installed.rc != 0
  block:
    - name: Crear el namespace argocd
      ansible.builtin.command: k3s kubectl create namespace argocd
      changed_when: true

    # server-side: los CRDs de ArgoCD son demasiado grandes para un apply normal
    - name: Aplicar los manifiestos oficiales de ArgoCD
      ansible.builtin.command: >-
        k3s kubectl apply -n argocd --server-side --force-conflicts
        -f https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml
      changed_when: true

    - name: Esperar a que ArgoCD esté listo
      ansible.builtin.command: k3s kubectl -n argocd rollout status deployment/argocd-server --timeout=300s
      changed_when: false

- name: Aplicar la Application raíz (App of Apps)
  ansible.builtin.command:
    cmd: k3s kubectl apply -f -
    stdin: "{{ lookup('ansible.builtin.file', homelab_repo_dir + '/bootstrap/root-app.yaml') }}"
  register: argocd_root
  changed_when: "'unchanged' not in argocd_root.stdout"
