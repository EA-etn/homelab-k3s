# Lo que necesita cualquier máquina del homelab antes de instalar k3s.

# Cada máquina se llama como en el inventario (las VPS venían como "racknerd-…")
- name: Poner el hostname del inventario
  ansible.builtin.hostname:
    name: "{{ inventory_hostname }}"

# sudo y otros programas buscan el propio nombre en /etc/hosts: sin esta línea, cada sudo tarda
# unos segundos y avisa de "unable to resolve host"
- name: El propio nombre en /etc/hosts
  ansible.builtin.lineinfile:
    path: /etc/hosts
    regexp: '^127\.0\.1\.1\s'
    line: "127.0.1.1 {{ inventory_hostname }}"

# Si la imagen de la VPS usa cloud-init, que no devuelva el nombre antiguo al reiniciar
- name: Ver si hay cloud-init
  ansible.builtin.stat:
    path: /etc/cloud/cloud.cfg
  register: common_cloud_init

- name: Que cloud-init respete el hostname
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-homelab-hostname.cfg
    content: |
      # Gestionado por Ansible (homelab-k3s/ansible/roles/common)
      preserve_hostname: true
    owner: root
    group: root
    mode: "0644"
  when: common_cloud_init.stat.exists

- name: Instalar los paquetes básicos
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# k3s necesita el controlador de memoria de cgroups. En la Raspberry Pi viene desactivado y se
# activa en la línea de arranque del kernel. En el PC ya viene activo y esta parte no hace nada.
- name: Comprobar si el kernel tiene el controlador de memoria de cgroups
  ansible.builtin.slurp:
    src: /sys/fs/cgroup/cgroup.controllers
  register: common_cgroups

- name: Activar el controlador de memoria en el arranque (Raspberry Pi)
  ansible.builtin.lineinfile:
    path: /boot/firmware/cmdline.txt
    # cmdline.txt es una sola línea: se añaden los dos parámetros al final si no están
    regexp: '^(?!.*cgroup_enable=memory)(.*)$'
    line: '\1 cgroup_enable=memory cgroup_memory=1'
    backrefs: true
  when:
    - "'memory' not in (common_cgroups.content | b64decode)"
    - ansible_facts['architecture'] == 'aarch64'
  notify: Reiniciar la máquina

- name: Configurar la tapa del portátil (no suspender al cerrarla)
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/10-homelab.conf
    content: |
      # Gestionado por Ansible (homelab-k3s/ansible/roles/common)
      [Login]
      HandleLidSwitch=ignore
      HandleLidSwitchExternalPower=ignore
      HandleLidSwitchDocked=ignore
    owner: root
    group: root
    mode: "0644"
  when: common_laptop_ignore_lid | bool
  notify: Recargar systemd-logind

# Si el portátil deja de ser nodo, vuelve a suspenderse al cerrar la tapa
- name: Quitar la configuración de la tapa si ya no hace falta
  ansible.builtin.file:
    path: /etc/systemd/logind.conf.d/10-homelab.conf
    state: absent
  when: not (common_laptop_ignore_lid | bool)
  notify: Recargar systemd-logind

# Si hubo que reiniciar, que sea ahora y no al final del playbook
- name: Aplicar los reinicios pendientes
  ansible.builtin.meta: flush_handlers
