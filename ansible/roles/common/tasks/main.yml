# Lo que necesita cualquier máquina del homelab antes de instalar k3s.

- name: Instalar los paquetes básicos
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

# k3s necesita el controlador de memoria de cgroups. En la Raspberry Pi viene desactivado y se
# activa en la línea de arranque del kernel. En el PC ya viene activo y esta parte no hace nada.
- name: Comprobar si el kernel tiene el controlador de memoria de cgroups
  ansible.builtin.slurp:
    src: /sys/fs/cgroup/cgroup.controllers
  register: common_cgroups

- name: Activar el controlador de memoria en el arranque (Raspberry Pi)
  ansible.builtin.lineinfile:
    path: /boot/firmware/cmdline.txt
    # cmdline.txt es una sola línea: se añaden los dos parámetros al final si no están
    regexp: '^(?!.*cgroup_enable=memory)(.*)$'
    line: '\1 cgroup_enable=memory cgroup_memory=1'
    backrefs: true
  when:
    - "'memory' not in (common_cgroups.content | b64decode)"
    - ansible_facts['architecture'] == 'aarch64'
  notify: Reiniciar la máquina

- name: Configurar la tapa del portátil (no suspender al cerrarla)
  ansible.builtin.copy:
    dest: /etc/systemd/logind.conf.d/10-homelab.conf
    content: |
      # Gestionado por Ansible (homelab-k3s/ansible/roles/common)
      [Login]
      HandleLidSwitch=ignore
      HandleLidSwitchExternalPower=ignore
      HandleLidSwitchDocked=ignore
    owner: root
    group: root
    mode: "0644"
  when: common_laptop_ignore_lid | bool
  notify: Recargar systemd-logind

# Si hubo que reiniciar, que sea ahora y no al final del playbook
- name: Aplicar los reinicios pendientes
  ansible.builtin.meta: flush_handlers
