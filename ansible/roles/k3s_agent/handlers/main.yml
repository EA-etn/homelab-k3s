- name: Reiniciar el agente k3s
  ansible.builtin.systemd_service:
    name: k3s-agent
    state: restarted
  # Solo si k3s ya estaba instalado: una instalación nueva ya arranca con config.yaml (y en una
  # simulación sobre una máquina sin k3s, el servicio aún no existe)
  when: k3s_agent_installed.rc == 0
