# Ubuntu 25.10+ usa sudo-rs como sudo por defecto, y su pregunta de contraseña no es la que
# Ansible espera: la tarea se queda esperando hasta agotar el tiempo ("Timed out waiting for
# become success or become password prompt"). Ubuntu mantiene el sudo clásico como sudo.ws.
# La Pi (Ubuntu 24.04) usa el sudo clásico y no necesita esto.
ansible_become_exe: sudo.ws

# IP en la red privada WireGuard (rol wireguard)
wireguard_ip: 10.10.0.4
# IP en el túnel de salida por EE. UU. (rol wireguard_exit; se enciende a mano)
wireguard_exit_ip: 10.20.0.2
