# Borra el clúster entero: el "destroy" del homelab. Lo contrario de site.yml.
#
#   cd ansible
#   ansible-playbook reset.yml --ask-become-pass --ask-vault-pass
#
# Ejecuta los desinstaladores que dejó k3s: primero los agentes y después el servidor. Se borra
# todo lo que vive en el clúster (pods, ArgoCD, Secrets, volúmenes, las métricas de Prometheus).
# Ubuntu, los paquetes, /etc/hosts y tus archivos se quedan.
#
# Para volver a levantarlo: ansible-playbook site.yml --ask-become-pass --ask-vault-pass

- name: 0. Confirmar antes de borrar nada
  hosts: localhost
  connection: local
  gather_facts: false
  vars_prompt:
    - name: reset_confirmation
      prompt: "Se borrará el clúster entero (pods, ArgoCD, Secrets, métricas). Escribe 'destruir' para seguir"
      private: false
  tasks:
    - name: Parar si no se escribió 'destruir'
      ansible.builtin.assert:
        that: reset_confirmation == 'destruir'
        fail_msg: "Cancelado: no se ha borrado nada."
        success_msg: "Confirmado."

- name: 1. Desinstalar los agentes (workers)
  hosts: k3s_agents
  become: true
  gather_facts: false
  tasks:
    - name: Ejecutar k3s-agent-uninstall.sh
      ansible.builtin.command: /usr/local/bin/k3s-agent-uninstall.sh
      # Si el script ya no existe, k3s no está instalado: no hace nada
      args:
        removes: /usr/local/bin/k3s-agent-uninstall.sh

- name: 2. Desinstalar el servidor (control plane)
  hosts: k3s_server
  become: true
  gather_facts: false
  tasks:
    - name: Ejecutar k3s-uninstall.sh
      ansible.builtin.command: /usr/local/bin/k3s-uninstall.sh
      args:
        removes: /usr/local/bin/k3s-uninstall.sh
