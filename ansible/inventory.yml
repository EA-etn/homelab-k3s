# Las máquinas del homelab. Ansible se ejecuta desde nexcore (el portátil), que se gestiona en
# local; la Pi y las VPS, por SSH. El clúster: la Pi (control plane) y vps-lab (worker).
all:
  children:
    k3s_server:
      hosts:
        devops-lab:
          ansible_host: 10.9.8.100
          # Usuario con el que entras por SSH a la Pi. Cámbialo si es otro.
          ansible_user: antonio
    k3s_agents:
      hosts:
        # El worker es la VPS de laboratorio: siempre encendida (el portátil se suspendía y se movía)
        vps-lab:
          k3s_agent_node_role: worker
    # El portátil ya no es nodo: solo la estación de trabajo (kubectl por la VPN)
    workstation:
      hosts:
        nexcore:
          ansible_connection: local
    # VPS de RackNerd en Ashburn (EE. UU.), con IP pública: llevan firewall (rol firewall)
    vps:
      hosts:
        # Laboratorio: el worker de k3s (la CPU más moderna de las dos)
        vps-lab:
          ansible_host: 216.45.53.36
          ansible_user: antonio
        # Estable: fuera del clúster. Hub de la VPN; más adelante, backups y vigilancia externa
        vps-estable:
          ansible_host: 107.175.134.57
          ansible_user: antonio
    # Salida a internet por EE. UU. (10.20.0.0/24): el hub y los equipos que pueden usarla
    wireguard_exit:
      hosts:
        vps-estable:
        nexcore:
    # Red privada WireGuard (10.10.0.0/24): vps-estable es el hub y el resto se conecta a él
    wireguard:
      hosts:
        vps-estable:
        devops-lab:
        vps-lab:
        nexcore:
