# Plantilla de los secretos del homelab. NO pongas valores reales en este archivo.
# Está fuera de group_vars/ a propósito: Ansible carga todo lo que hay allí, y estos valores
# falsos no deben usarse nunca.
#
#   cp vault.example.yml group_vars/all/vault.yml
#   (rellena los valores)
#   ansible-vault encrypt group_vars/all/vault.yml
#
# vault.yml se sube a Git CIFRADO. Sin la contraseña del vault es ilegible.
# Para editarlo después: ansible-vault edit group_vars/all/vault.yml

# Contraseña de sudo del usuario de la Pi (antonio). La del PC se escribe al ejecutar
# el playbook con --ask-become-pass.
vault_become_password_pi: "CAMBIAME"

# Token del clúster k3s: una cadena larga y aleatoria inventada por ti (openssl rand -hex 32).
# NO copies el de /var/lib/rancher/k3s/server/node-token: empieza por K10<hash>::server:, y ese
# hash es el de la CA de ESE clúster. Al reconstruir se crea una CA nueva y el agente se niega a
# unirse ("token CA hash does not match"). Con una cadena simple vale para cualquier reconstrucción.
vault_k3s_token: "CAMBIAME"

# Bot de Telegram del homelab (docs/alerting.md)
vault_telegram_bot_token: "CAMBIAME"
vault_telegram_chat_id: "CAMBIAME"

# Ping URL del check de healthchecks.io (dead man's switch)
vault_healthchecks_ping_url: "https://hc-ping.com/CAMBIAME"

# Usuario y contraseña de admin de Grafana
vault_grafana_admin_user: "admin"
vault_grafana_admin_password: "CAMBIAME"
