name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.8.0
  PROMETHEUS_VERSION: 3.16.0
  ALERTMANAGER_VERSION: 0.34.2

jobs:
  validate:
    name: Manifiestos y scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

      # Valida los manifiestos, incluidas las Applications de ArgoCD (CRD) con el catálogo de esquemas de Datree
      - name: kubeconform
        run: |
          kubeconform -strict -summary -kubernetes-version 1.36.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            bootstrap/ apps/ platform/

      # ArgoCD rechaza repos con enlaces simbólicos que apuntan fuera del repo
      # ("out-of-bounds symlinks") y deja de sincronizar todas las apps que lo leen
      - name: Sin enlaces simbólicos
        run: |
          links=$(git ls-files -s | awk '$1 == "120000" {print $4}')
          if [ -n "$links" ]; then echo "Enlaces simbólicos en el repo:"; echo "$links"; exit 1; fi

      - name: shellcheck
        run: shellcheck bootstrap/*.sh tests/*/run.sh .githooks/pre-commit

      # promtool viene con Prometheus; se verifica su checksum antes de usarlo
      - name: Instalar promtool
        run: |
          base="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"
          file="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -sSLO "${base}/${file}"
          curl -sSL "${base}/sha256sums.txt" | grep " ${file}$" | sha256sum -c -
          tar -xzf "${file}"
          sudo install "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/

      # Tests unitarios de las reglas y alertas del SLO (series simuladas, sin clúster)
      - name: Tests de las reglas del SLO
        run: tests/slo/run.sh

      # amtool viene con Alertmanager (misma versión que despliega kube-prometheus-stack)
      - name: Instalar amtool
        run: |
          base="https://github.com/prometheus/alertmanager/releases/download/v${ALERTMANAGER_VERSION}"
          file="alertmanager-${ALERTMANAGER_VERSION}.linux-amd64.tar.gz"
          curl -sSLO "${base}/${file}"
          curl -sSL "${base}/sha256sums.txt" | grep " ${file}$" | sha256sum -c -
          tar -xzf "${file}"
          sudo install "alertmanager-${ALERTMANAGER_VERSION}.linux-amd64/amtool" /usr/local/bin/

      # Configuración de Alertmanager: sintaxis, rutas de cada alerta y mensaje de Telegram
      - name: Tests de Alertmanager
        run: tests/alertmanager/run.sh

      # Render real de kube-prometheus-stack con nuestros valores (como ArgoCD):
      # detecta valores borrados o mal indentados que ninguna otra validación ve
      - name: Render de monitoring
        run: |
          python3 -c "import yaml" 2>/dev/null || sudo apt-get install -y python3-yaml
          tests/monitoring/run.sh

  ansible:
    name: Ansible
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ansible
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Red de seguridad: los secretos solo pueden subirse cifrados con ansible-vault
      - name: El vault está cifrado
        run: |
          for f in $(git ls-files 'group_vars/**/vault.yml' 'host_vars/**/vault.yml'); do
            head -1 "$f" | grep -q '^\$ANSIBLE_VAULT;' || { echo "::error file=ansible/$f::$f NO está cifrado"; exit 1; }
            echo "ok: $f cifrado"
          done

      - name: Instalar Ansible
        run: pip install ansible-core==2.22.0 ansible-lint==26.11.0

      - name: Sintaxis del playbook
        run: ansible-playbook site.yml --syntax-check

      - name: ansible-lint
        run: ansible-lint

