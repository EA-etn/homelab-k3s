name: Validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  KUBECONFORM_VERSION: v0.8.0
  PROMETHEUS_VERSION: 3.16.0

jobs:
  validate:
    name: Manifiestos y scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin kubeconform

      # Valida los manifiestos, incluidas las Applications de ArgoCD (CRD) con el catálogo de esquemas de Datree
      - name: kubeconform
        run: |
          kubeconform -strict -summary -kubernetes-version 1.36.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            bootstrap/ apps/ platform/

      - name: shellcheck
        run: shellcheck bootstrap/*.sh tests/slo/run.sh

      # promtool viene con Prometheus; se verifica su checksum antes de usarlo
      - name: Instalar promtool
        run: |
          base="https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}"
          file="prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          curl -sSLO "${base}/${file}"
          curl -sSL "${base}/sha256sums.txt" | grep " ${file}$" | sha256sum -c -
          tar -xzf "${file}"
          sudo install "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/

      # Tests unitarios de las reglas y alertas del SLO (series simuladas, sin clúster)
      - name: Tests de las reglas del SLO
        run: tests/slo/run.sh
